<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Libreria 2ALD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; overflow-x: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
        
        /* 🚀 ACCELERAZIONE HARDWARE ESTREMA (GPU) */
        .fade-in { 
            animation: fadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            will-change: opacity; 
            transform: translate3d(0,0,0); 
            backface-visibility: hidden;
        }
        .slide-up { 
            animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards; 
            will-change: transform, opacity; 
            transform: translate3d(0,0,0); 
            backface-visibility: hidden;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translate3d(0, 15px, 0) scale(0.98); } to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
        
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transform: translate3d(0,0,0); }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type="file"]::file-selector-button { border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; background-color: #e0e7ff; color: #4f46e5; font-weight: bold; cursor: pointer; transition: background-color 0.2s; margin-right: 10px; }
        
        .star-cb-group { display: flex; flex-direction: row-reverse; justify-content: center; }
        .star-cb-group input { display: none; }
        .star-cb-group label { font-size: 2.5rem; color: #cbd5e1; cursor: pointer; transition: color 0.15s; padding: 0 4px; }
        .star-cb-group label:hover, .star-cb-group label:hover ~ label, .star-cb-group input:checked ~ label { color: #fbbf24; }
        @media (max-width: 640px) { .star-cb-group label { font-size: 2rem; padding: 0 2px; } }

        /* Effetti Modalità Dio - GPU Accelerated */
        @keyframes terremoto { 0% { transform: translate3d(2px, 1px, 0) rotate(0deg); } 10% { transform: translate3d(-1px, -2px, 0) rotate(-1deg); } 20% { transform: translate3d(-3px, 0px, 0) rotate(1deg); } 30% { transform: translate3d(0px, 2px, 0) rotate(0deg); } 40% { transform: translate3d(1px, -1px, 0) rotate(1deg); } 50% { transform: translate3d(-1px, 2px, 0) rotate(-1deg); } 60% { transform: translate3d(-3px, 1px, 0) rotate(0deg); } 70% { transform: translate3d(2px, 1px, 0) rotate(-1deg); } 80% { transform: translate3d(-1px, -1px, 0) rotate(1deg); } 90% { transform: translate3d(2px, 2px, 0) rotate(0deg); } 100% { transform: translate3d(1px, -2px, 0) rotate(-1deg); } }
        .caos-terremoto { animation: terremoto 0.3s infinite; will-change: transform; }
        @keyframes discoteca { 0% { filter: hue-rotate(0deg) saturate(2); } 100% { filter: hue-rotate(360deg) saturate(2); } }
        .caos-discoteca { animation: discoteca 1.5s infinite; will-change: filter; }
        .caos-sottosopra { transform: rotate(180deg) translate3d(0,0,0); transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform; }
        .caos-buio * { background-color: black !important; color: black !important; border-color: black !important; box-shadow: none !important; background-image: none !important; }
        .caos-comic * { font-family: "Comic Sans MS", "Comic Sans", cursive !important; }
        .falling-item { position: fixed; top: -50px; font-size: 2rem; z-index: 9999; animation: fall linear forwards; pointer-events: none; will-change: transform; }
        @keyframes fall { to { transform: translate3d(0, 110vh, 0) rotate(360deg); } }
        
        /* Ottimizzazione immagini */
        img { content-visibility: auto; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-200 min-h-screen pb-20">

    <!-- SCHERMATA BLOCCO SERVER -->
    <div id="server-overlay" class="hidden fixed inset-0 z-[99999] bg-black/95 backdrop-blur-xl text-white flex flex-col items-center justify-center font-bold text-center p-6 fade-in">
        <span class="text-7xl mb-6">🛑</span>
        <h1 id="server-overlay-title" class="text-4xl sm:text-5xl mb-4 font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">SERVER SPENTO</h1>
        <p id="server-overlay-msg" class="text-slate-400 text-lg sm:text-xl">Accesso temporaneamente bloccato.</p>
    </div>

    <!-- SCHERMATA BAN DISPOSITIVO -->
    <div id="ban-overlay" class="hidden fixed inset-0 z-[99999] bg-red-950 backdrop-blur-3xl text-red-500 flex flex-col items-center justify-center font-bold text-center p-6 fade-in">
        <span class="text-7xl mb-6">🔨</span>
        <h1 class="text-4xl sm:text-5xl mb-4 font-black text-red-600 drop-shadow-lg">DISPOSITIVO BANNATO</h1>
        <p class="text-red-400 text-lg sm:text-xl">Questo dispositivo ha violato le regole ed è stato bloccato in modo permanente.</p>
    </div>

    <div id="app" class="min-h-screen">
        <div class="flex items-center justify-center min-h-screen">
            <div class="animate-pulse text-2xl font-bold text-indigo-500 flex items-center gap-3">
                <span class="text-4xl">📚</span> Caricamento...
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, serverTimestamp, arrayUnion, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDZdJIgJA_3IAdG1VHJT7Q5oOrjXx5mTlA",
        authDomain: "libreria-2ald.firebaseapp.com",
        projectId: "libreria-2ald",
        storageBucket: "libreria-2ald.firebasestorage.app",
        messagingSenderId: "974015964601",
        appId: "1:974015964601:web:a093dd4ccbb815c2df0268"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // COSTANTI CREATORI SUPREMI
    const GOD_EMAILS = ["riccardonicchi27@gmail.com", "riccardonicchi3@gmail.com"];

    // Sistema di sicurezza per Isola Sessione
    const PAGE_LOAD_TIME = Date.now();

    // Fingerprinting Dispositivo
    let LOCAL_DEVICE_ID = localStorage.getItem("libreria_device_id");
    if (!LOCAL_DEVICE_ID) {
        LOCAL_DEVICE_ID = Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem("libreria_device_id", LOCAL_DEVICE_ID);
    }

    // Variabili di Stato Globali
    let state = {
        user: null,
        userData: { libri_letti: [], badge: null, volte_admin: 0, ruolo: 'utente' }, 
        isAdmin: false,
        isGod: false,
        isLoaded: false,
        tab: 'catalogo',
        authMode: 'login', 
        books: [],
        requests: [],
        users: [],
        reviews: [],
        comments: [], 
        allarmi: [], // <--- Memoria Sabotaggi
        modal: null, 
        selectedReviewBookId: null,
        unsubs: [],
        presenceInterval: null
    };

    let serverState = { attivo: true, last_force_reload: null };
    let bannedDevices = [];

    const $ = id => document.getElementById(id);
    const escapeHTML = str => String(str || "").replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));
    const DAY = 86400000;
    const INPUT_CLS = "w-full rounded-2xl border-2 border-slate-200 px-3 sm:px-4 py-2.5 sm:py-3.5 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none transition-all font-medium bg-slate-50 focus:bg-white text-sm sm:text-base";

    // Generatore Omino Grigio (Decodifica asincrona e Lazy Loading per MASSIMA velocità)
    window.getAvatar = (url, classes = "w-8 h-8") => {
        if (url && url.length > 10) {
            return `<img src="${escapeHTML(url)}" loading="lazy" decoding="async" class="${classes} rounded-full object-cover shadow-sm border border-slate-200 shrink-0">`;
        } else {
            return `<div class="${classes} shrink-0 rounded-full bg-slate-200 border border-slate-300 flex items-center justify-center overflow-hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3/4 h-3/4 text-slate-400 mt-[15%]">
                            <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z" clip-rule="evenodd" />
                        </svg>
                    </div>`;
        }
    };

    function checkServerStatus() {
        const overlay = $('server-overlay');
        if (state.isGod) {
            overlay.classList.add('hidden');
            return;
        }

        if (serverState.attivo === false) {
            $('server-overlay-title').innerText = "SERVER SPENTO";
            $('server-overlay-msg').innerText = "Il database è stato spento dall'amministratore.";
            overlay.classList.remove('hidden');
        } else if (serverState.last_force_reload && PAGE_LOAD_TIME < serverState.last_force_reload) {
            $('server-overlay-title').innerText = "VERSIONE OBSOLETA";
            $('server-overlay-msg').innerText = "C'è un aggiornamento critico. Per favore ricarica la pagina.";
            overlay.classList.remove('hidden');
        } else {
            overlay.classList.add('hidden');
        }
    }

    // -------------------------------------------------------------
    // MOTORE DEL CAOS
    // -------------------------------------------------------------
    window.innescaCaos = (evento, messaggio) => {
        if (evento === 'messaggio') {
            CustomUI.show(`📢 LA VOCE SUPREMA:\n\n${escapeHTML(messaggio)}`, 'alert');
            return;
        }

        const body = document.body;
        const rimuoviTutto = () => { body.classList.remove('caos-discoteca', 'caos-terremoto', 'caos-sottosopra', 'caos-buio', 'caos-comic'); };
        rimuoviTutto();

        if (evento === 'discoteca') {
            body.classList.add('caos-discoteca');
            setTimeout(rimuoviTutto, 10000);
        } else if (evento === 'terremoto') {
            body.classList.add('caos-terremoto');
            setTimeout(rimuoviTutto, 8000);
        } else if (evento === 'sottosopra') {
            body.classList.add('caos-sottosopra');
            setTimeout(rimuoviTutto, 15000);
        } else if (evento === 'buio') {
            body.classList.add('caos-buio');
            setTimeout(rimuoviTutto, 10000);
        } else if (evento === 'comic') {
            body.classList.add('caos-comic');
            setTimeout(rimuoviTutto, 15000);
        } else if (evento === 'rickroll') {
            const rr = document.createElement('div');
            rr.className = 'fixed inset-0 z-[999999] bg-black flex flex-col items-center justify-center fade-in';
            rr.innerHTML = `
                <button onclick="this.parentNode.remove()" class="absolute top-6 right-6 px-6 py-3 bg-red-600 text-white font-black uppercase tracking-wider rounded-2xl z-[1000000] hover:bg-red-700 shadow-2xl transition-transform active:scale-95">CHIEDI PIETÀ 🏳️</button>
                <iframe width="100%" height="100%" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0&disablekb=1&fs=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            `;
            document.body.appendChild(rr);
        } else if (['pioggia', 'gattini', 'thanos'].includes(evento)) {
            let emoji = '🌧️';
            if (evento === 'gattini') emoji = '🐱';
            if (evento === 'thanos') emoji = '💨';
            
            let count = 0;
            // Ottimizzazione caduta emoji via requestAnimationFrame per evitare blocchi JS
            let lastTime = 0;
            const animateFall = (time) => {
                if (time - lastTime > 100) {
                    if (count > 50) return;
                    const el = document.createElement('div');
                    el.className = 'falling-item drop-shadow-lg';
                    el.innerText = emoji;
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                    el.style.fontSize = (Math.random() * 2.5 + 2) + 'rem';
                    document.body.appendChild(el);
                    setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 3500);
                    count++;
                    lastTime = time;
                }
                if (count <= 50) requestAnimationFrame(animateFall);
            };
            requestAnimationFrame(animateFall);
            
            if(evento === 'thanos') {
               const appDiv = document.getElementById('app');
               if(appDiv) {
                   appDiv.style.transition = "opacity 4s cubic-bezier(0.4, 0, 0.2, 1), filter 4s cubic-bezier(0.4, 0, 0.2, 1)";
                   appDiv.style.opacity = "0";
                   appDiv.style.filter = "blur(15px)";
                   appDiv.style.willChange = "opacity, filter";
                   setTimeout(() => {
                       appDiv.style.transition = "opacity 2s ease-out, filter 2s ease-out";
                       appDiv.style.opacity = "1";
                       appDiv.style.filter = "blur(0)";
                       setTimeout(() => { appDiv.style.willChange = "auto"; }, 2000);
                   }, 10000);
               }
            }
        }
    };
    // -------------------------------------------------------------

    onAuthStateChanged(auth, async user => {
        state.unsubs.forEach(unsub => unsub()); 
        state.unsubs = [];
        if (state.presenceInterval) clearInterval(state.presenceInterval);
        state.user = user;
        state.isLoaded = false;
        
        // ------------------------------------------------------------------
        // FIREWALL ANTI-HACKER CONSOLE
        // ------------------------------------------------------------------
        if (user) {
            const isGodUser = GOD_EMAILS.includes(user.email);
            
            if (sessionStorage.getItem("godLoggato") === "true") {
                if (isGodUser) {
                    state.isAdmin = true;
                    state.isGod = true;
                } else {
                    sessionStorage.removeItem("godLoggato");
                    sessionStorage.removeItem("adminLoggato");
                    state.isAdmin = false;
                    state.isGod = false;
                    
                    const logEntry = {
                        data: Date.now(),
                        attaccante_nome: user.displayName || "Sconosciuto",
                        attaccante_email: user.email,
                        bersaglio: "SISTEMA - HACKING CONSOLE",
                        messaggio: "Ha incollato script nella console per forzare l'accesso alla Modalità Dio. Azione bloccata."
                    };
                    setDoc(doc(db, "sistema", "sicurezza"), { log: arrayUnion(logEntry) }, { merge: true });
                    
                    setTimeout(() => alert("⛔ ACCESSO NEGATO: Rilevato tentativo di aggirare la sicurezza tramite Console! Le autorità di sistema sono state allertate."), 500);
                }
            } else if (sessionStorage.getItem("adminLoggato") === "true") {
                state.isAdmin = true;
            }
        }
        // ------------------------------------------------------------------

        state.unsubs.push(onSnapshot(doc(db, "sistema", "stato_server"), d => {
            if (d.exists()) {
                serverState = d.data();
                checkServerStatus();
            } else if (state.isGod) {
                setDoc(doc(db, "sistema", "stato_server"), { attivo: true, last_force_reload: null });
            }
        }));

        state.unsubs.push(onSnapshot(doc(db, "sistema", "blacklist"), d => {
            if (d.exists()) {
                bannedDevices = d.data().devices || [];
                if (bannedDevices.includes(LOCAL_DEVICE_ID) && !state.isGod) {
                    $('ban-overlay').classList.remove('hidden');
                } else {
                    $('ban-overlay').classList.add('hidden');
                }
            } else if (state.isGod) {
                setDoc(doc(db, "sistema", "blacklist"), { devices: [] });
            }
        }));

        if (user) {
            const updatePresence = () => { if(state.user) updateDoc(doc(db, "utenti", user.uid), { lastActive: serverTimestamp() }).catch(()=>{}); };
            updatePresence();
            state.presenceInterval = setInterval(updatePresence, 10000);
            window.addEventListener('beforeunload', () => { if(state.user) updateDoc(doc(db, "utenti", user.uid), { lastActive: null }).catch(()=>{}); });

            state.unsubs.push(onSnapshot(doc(db, "utenti", user.uid), async docSnap => {
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // CONTROLLO FALSO ADMIN
                    if (!GOD_EMAILS.includes(user.email) && data.ruolo !== 'admin' && data.ruolo !== 'god' && state.isAdmin) {
                        state.isAdmin = false;
                        sessionStorage.removeItem("adminLoggato");
                        
                        const logEntry = {
                            data: Date.now(),
                            attaccante_nome: data.nome || user.displayName || "Sconosciuto",
                            attaccante_email: user.email,
                            bersaglio: "SISTEMA - HACKING CONSOLE",
                            messaggio: "Ha incollato script nella console per fingersi Admin. Azione bloccata."
                        };
                        setDoc(doc(db, "sistema", "sicurezza"), { log: arrayUnion(logEntry) }, { merge: true });
                        
                        setTimeout(() => alert("⛔ ACCESSO NEGATO: Tentativo di falso login Admin tramite Console rilevato. Registrato."), 500);
                        if(state.tab === 'admin') state.tab = 'catalogo';
                        requestRender(); // Usiamo render ottimizzato
                    }

                    // MANTENIMENTO FORCE ADMIN E LOG SABOTAGGIO OFFLINE PER CREATORI
                    if (GOD_EMAILS.includes(state.user.email)) {
                        if (data.ruolo !== 'admin' && data.ruolo !== 'god') {
                            await updateDoc(doc(db, "utenti", state.user.uid), { ruolo: 'admin' }).catch(()=>{});
                            data.ruolo = 'admin'; 
                            
                            const logEntry = {
                                data: Date.now(),
                                attaccante_nome: "Ignoto (Forzatura esterna / DB)",
                                attaccante_email: "Sconosciuta",
                                bersaglio: state.user.email,
                                messaggio: "Il sistema ha rilevato che il ruolo era stato rimosso in modo anomalo mentre eri offline. Il grado è stato ripristinato automaticamente."
                            };
                            await setDoc(doc(db, "sistema", "sicurezza"), { log: arrayUnion(logEntry) }, { merge: true });
                        }
                    }
                    
                    const oldBadge = state.userData.badge;
                    const oldAvatar = state.userData.avatar;
                    state.userData = data;
                    state.isLoaded = true;
                    if(!state.userData.libri_letti) state.userData.libri_letti = [];
                    if (oldBadge !== data.badge || oldAvatar !== data.avatar) backgroundUpdate();
                } else if (state.isLoaded) {
                    logout();
                    alert("Il tuo account è stato eliminato dall'amministratore.");
                    window.location.reload();
                }
            }));

            caricaDati();
        } else {
            state.isAdmin = false;
            state.isGod = false;
        }
        requestRender();
    });

    // 🚀 OTTIMIZZAZIONE MASSIMA: DEBOUNCING E REQUEST ANIMATION FRAME (120FPS Feel)
    let bgUpdateTimer;
    function backgroundUpdate() {
        if (state.tab === 'proponi' || state.modal) return;
        clearTimeout(bgUpdateTimer);
        bgUpdateTimer = setTimeout(() => requestRender(false), 16); // ~60fps batching
    }

    let isRendering = false;
    let renderRequested = false;
    let shouldAnimateNextRender = true;

    // Sostituisce render() diretto per fluidità estrema sincronizzata col monitor
    function requestRender(animate = true) {
        if (!animate) shouldAnimateNextRender = false;
        if (!isRendering) {
            isRendering = true;
            requestAnimationFrame(() => {
                actualRender(shouldAnimateNextRender);
                isRendering = false;
                shouldAnimateNextRender = true; // reset
            });
        }
    }

    function caricaDati() {
        state.unsubs.push(onSnapshot(collection(db, "libri"), s => { state.books = s.docs.map(d => ({ id: d.id, ...d.data() })); backgroundUpdate(); }));
        state.unsubs.push(onSnapshot(collection(db, "recensioni"), s => { state.reviews = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.data - a.data); backgroundUpdate(); }));
        state.unsubs.push(onSnapshot(collection(db, "commenti"), s => { state.comments = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.data - b.data); backgroundUpdate(); }));
        
        if (state.isAdmin) {
            state.unsubs.push(onSnapshot(query(collection(db, "richieste"), where("stato", "==", "in_attesa")), s => { state.requests = s.docs.map(d => ({ id: d.id, ...d.data() })); backgroundUpdate(); }));
            state.unsubs.push(onSnapshot(collection(db, "utenti"), s => { state.users = s.docs.map(d => ({ id: d.id, ...d.data() })); backgroundUpdate(); }));
            
            state.unsubs.push(onSnapshot(doc(db, "sistema", "sicurezza"), d => {
                if(d.exists()) {
                    state.allarmi = d.data().log || [];
                    backgroundUpdate();
                } else if (state.isGod) {
                    setDoc(doc(db, "sistema", "sicurezza"), { log: [] });
                }
            }));
        }

        state.unsubs.push(onSnapshot(doc(db, "sistema", "caos"), d => {
            if(d.exists()) {
                const data = d.data();
                if(data.timestamp && (Date.now() - data.timestamp.toMillis() < 15000)) {
                    const targets = data.targets || ['all'];
                    if (targets.includes('all') || targets.includes(state.user.uid)) {
                        window.innescaCaos(data.evento, data.messaggio);
                    }
                }
            }
        }));
    }

    window.toggleAuthMode = () => {
        state.authMode = state.authMode === 'login' ? 'register' : 'login';
        requestRender();
    };

    window.gestisciLogin = async (e) => {
        e.preventDefault();
        const isRegister = state.authMode === 'register';
        const email = $('email').value.trim();
        const password = $('password').value;
        const btn = $('authSubmitBtn');
        const originalText = btn.innerText;
        
        btn.innerText = "Attendere..."; btn.disabled = true;
        $('errorBox').innerText = "";

        try {
            if (isRegister) {
                const emailRegex = /^[a-zA-Z0-9._%+-]{3,}@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/;
                if(!emailRegex.test(email)) throw new Error("Devi inserire un'email reale e valida.");
                const fakeDomains = ['temp-mail.org', '10minutemail.com', 'guerrillamail.com', 'mailinator.com', 'yopmail.com'];
                const domain = email.split('@')[1];
                if (fakeDomains.includes(domain)) throw new Error("Non puoi usare email temporanee o false.");
                const badWords = ['sborra', 'cazzo', 'merda', 'puttana', 'troia', 'fake', 'admin', 'root'];
                if (badWords.some(w => email.toLowerCase().includes(w))) throw new Error("Email non consentita per Policy di Sicurezza.");
                
                const nome = $('nome').value.trim();
                if(!nome || nome === "") throw new Error("Inserisci il tuo nome e cognome.");

                let cred;
                try {
                    cred = await createUserWithEmailAndPassword(auth, email, password);
                } catch (createErr) {
                    if (createErr.code === 'auth/email-already-in-use') {
                        try {
                            let tempCred = await signInWithEmailAndPassword(auth, email, password);

    function comprimiInBase64(file, maxWidth = 600, maxHeight = 800, quality = 0.6, isSquare = false) {
        return new Promise((resolve, reject) => {
            if (file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif')) return reject(new Error("Formato HEIC (iPhone) non supportato."));
            if (file.type.startsWith('video/')) return reject(new Error("I video sono troppo pesanti per il database. Inserisci una foto o una GIF."));
            if (!file.type.startsWith('image/')) return resolve(null);

            const objectUrl = URL.createObjectURL(file);
            const img = new Image();
            img.src = objectUrl;

            img.onload = () => {
                URL.revokeObjectURL(objectUrl);
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;

                if (isSquare) {
                    const minSize = Math.min(w, h);
                    const maxSize = Math.min(minSize, maxWidth);
                    canvas.width = maxSize; canvas.height = maxSize;
                    const ctx = canvas.getContext('2d');
                    const x = (w - minSize) / 2;
                    const y = (h - minSize) / 2;
                    ctx.drawImage(img, x, y, minSize, minSize, 0, 0, maxSize, maxSize);
                } else {
                    if (w > h) { if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; } } 
                    else       { if (h > maxHeight) { w = Math.round(w * (maxHeight / h)); h = maxHeight; } }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                }
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Errore Canvas Base64")); };
        });
    }

                <button onclick="miracoloApprovazione()" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 font-bold p-3 sm:p-5 rounded-xl sm:rounded-2xl backdrop-blur-sm border border-emerald-500/20 flex flex-col items-center gap-1 sm:gap-2 text-xs sm:text-base"><span class="text-2xl sm:text-3xl">✨</span> Miracolo</button>
                <button onclick="amnistiaGenerale()" class="bg-blue-500/10 hover:bg-blue-500/20 text-blue-300 font-bold p-3 sm:p-5 rounded-xl sm:rounded-2xl backdrop-blur-sm border border-blue-500/20 flex flex-col items-center gap-1 sm:gap-2 text-xs sm:text-base"><span class="text-2xl sm:text-3xl">🕊</span> Amnistia</button>
                <button onclick="apocalisse()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 font-bold p-3 sm:p-5 rounded-xl sm:rounded-2xl backdrop-blur-sm border border-rose-500/20 flex flex-col items-center gap-1 sm:gap-2 text-xs sm:text-base"><span class="text-2xl sm:text-3xl">💀</span> Apocalisse</button>
            </div>

            <h3 class="text-lg sm:text-xl font-bold mb-3 sm:mb-4 text-purple-200">Radar (Utenti Online)</h3>
            <div class="bg-black/40 p-4 sm:p-5 rounded-xl sm:rounded-2xl border border-purple-500/30 mb-6 sm:mb-8 relative z-10">
                <div class="flex items-center gap-2 sm:gap-3 mb-3 sm:mb-4 border-b border-purple-500/30 pb-3 sm:pb-4">
                    <input type="checkbox" id="target-all" class="target-cb w-4 h-4 sm:w-5 sm:h-5 accent-purple-500 cursor-pointer" value="all" checked onchange="document.querySelectorAll('.target-user').forEach(c => c.checked = false)">
                    <label for="target-all" class="text-white font-bold cursor-pointer text-xs sm:text-sm">🌐 Colpisci TUTTI</label>
                </div>
                <div id="god-radar-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3 max-h-48 overflow-y-auto pr-1 sm:pr-2 hide-scrollbar">
                    ${onlineUsers.length ? onlineUsers.map(u => `<label class="flex items-center gap-2 sm:gap-3 bg-white/5 p-2 sm:p-3 rounded-lg sm:rounded-xl cursor-pointer hover:bg-white/10 transition-colors border border-white/5"><input type="checkbox" class="target-cb target-user w-4 h-4 sm:w-5 sm:h-5 accent-purple-500 cursor-pointer" value="${u.id}" onchange="document.getElementById('target-all').checked = false"><div class="flex flex-col truncate"><span class="text-xs sm:text-sm font-bold text-white truncate">${escapeHTML(u.nome)}</span><span class="text-[8px] sm:text-[10px] text-emerald-400 font-black tracking-widest">ONLINE</span></div></label>`).join('') : '<p class="text-xs sm:text-sm text-slate-400 italic font-medium">Nessuno online ora.</p>'}
                </div>
            </div>

            <h3 class="text-lg sm:text-xl font-bold mb-3 sm:mb-4 text-purple-200">Caos e Divertimento</h3>
            <div class="grid grid-cols-3 lg:grid-cols-6 gap-2 sm:gap-4 relative z-10">
                <button onclick="invocaPotere('discoteca')" class="bg-pink-500/10 hover:bg-pink-500/20 text-pink-300 font-bold p-2 sm:p-4 rounded-xl sm:rounded-2xl border border-pink-500/20 flex flex-col items-center text-[10px] sm:text-xs text-center"><span class="text-xl sm:text-2xl mb-0.5 sm:mb-1">🪩</span> Disco</button>
                <button onclick="invocaPotere('terremoto')" class="bg-orange-500/10 hover:bg-orange-500/20 text-orange-300 font-bold p-2 sm:p-4 rounded-xl sm:rounded-2xl border border-orange-500/20 flex flex-col items-center text-[10px] sm:text-xs text-center"><span class="text-xl sm:text-2xl mb-0.5 sm:mb-1">🫨</span> Sisico</button>
                <button onclick="invocaPotere('pioggia')" class="bg-teal-500/10 hover:bg-teal-500/20 text-teal-300 font-bold p-2 sm:p-4 rounded-xl sm:rounded-2xl border border-teal-500/20 flex flex-col items-center text-[10px] sm:text-xs text-center"><span class="text-xl sm:text-2xl mb-0.5 sm:mb-1">🌧️</span> Pioggia</button>
                <button onclick="invocaPotere('rickroll')" class="bg-red-500/10 hover:bg-red-500/20 text-red-300 font-bold p-2 sm:p-4 rounded-xl sm:rounded-2xl border border-red-500/20 flex flex-col items-center text-[10px] sm:text-xs text-center"><span class="text-xl sm:text-2xl mb-0.5 sm:mb-1">🕺</span> Rickroll</button>
                <button onclick="invocaPotere('gattini')" class="bg-yellow-500/10 hover:bg-yellow-500/20 text-yellow-300 font-bold p-2 sm:p-4 rounded-xl sm:rounded-2xl border border-yellow-500/20 flex flex-col items-center text-[10px] sm:text-xs text-center"><span class="text-xl sm:text-2xl mb-0.5 sm:mb-1">🐱</span> Gattini</button>
                <button onclick="invocaPotere('sottosopra')" class="bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 font-bold p-2 sm:p-4 rounded-xl sm:rounded-2xl border border-indigo-500/20 flex flex-col items-center text-[10px] sm:text-xs text-center"><span class="text-xl sm:text-2xl mb-0.5 sm:mb-1">🙃</span> SottoSopra</button>
                <button onclick="invocaPotere('comic')" class="bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 font-bold p-2 sm:p-4 rounded-xl sm:rounded-2xl border border-cyan-500/20 flex flex-col items-center text-[10px] sm:text-xs text-center"><span class="text-xl sm:text-2xl mb-0.5 sm:mb-1">🖍️</span> Comic</button>
                <button onclick="invocaPotere('buio')" class="bg-gray-700/50 hover:bg-gray-600/50 text-gray-300 font-bold p-2 sm:p-4 rounded-xl sm:rounded-2xl border border-gray-500/20 flex flex-col items-center text-[10px] sm:text-xs text-center"><span class="text-xl sm:text-2xl mb-0.5 sm:mb-1">🌒</span> Blackout</button>
                <button onclick="invocaPotere('thanos')" class="bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 font-bold p-2 sm:p-4 rounded-xl sm:rounded-2xl border border-purple-400/50 flex flex-col items-center text-[10px] sm:text-xs text-center shadow-lg shadow-purple-900"><span class="text-xl sm:text-2xl mb-0.5 sm:mb-1">💨</span> Thanos</button>
            </div>
        </div>`;
    }

    // IL MOTORE DI RENDER A 120FPS
    function actualRender(animate = true) {
        const appDiv = $('app');
        if (!state.user) {
            appDiv.innerHTML = `
            <div class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-slate-50 fade-in">
                <div class="bg-white rounded-3xl sm:rounded-[2.5rem] p-6 sm:p-10 shadow-2xl border border-slate-100 w-full max-w-md">
                    <div class="text-center mb-6 sm:mb-8"><div class="text-5xl sm:text-6xl mb-3 sm:mb-4">📚</div><h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Libreria 2ALD</h1></div>
                    <form onsubmit="gestisciLogin(event)" class="space-y-3 sm:space-y-4">
                        ${state.authMode === 'register' ? `<input id="nome" type="text" placeholder="Il tuo Nome e Cognome" class="${INPUT_CLS}" required>` : ''}
                        <input id="email" type="email" placeholder="Email" required class="${INPUT_CLS}">
                        <input id="password" type="password" placeholder="Password (min 6 caratteri)" required class="${INPUT_CLS}">
                        <p id="errorBox" class="text-red-500 text-xs sm:text-sm font-bold text-center h-4 sm:h-5"></p>
                        <button id="authSubmitBtn" type="submit" class="w-full text-white font-extrabold py-3 sm:py-4 rounded-xl sm:rounded-2xl shadow-lg transition-all active:scale-95 text-sm sm:text-base ${state.authMode === 'register' ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-indigo-600 hover:bg-indigo-700'}">
                            ${state.authMode === 'register' ? 'Crea Account' : 'Accedi'}
                        </button>
                    </form>
                    <div class="mt-5 sm:mt-6 text-center border-t border-slate-100 pt-5 sm:pt-6">
                        <button onclick="toggleAuthMode()" type="button" class="text-indigo-600 font-bold hover:text-indigo-800 transition-colors text-xs sm:text-sm">
                            ${state.authMode === 'register' ? 'Hai già un account? Accedi' : 'Non hai un account? Registrati'}
                        </button>
                    </div>
                </div>
            </div>`;
            return;
        }

        let godChecked = [];
        let allChecked = true;
        if (state.tab === 'god') {
            const radar = document.getElementById('god-radar-list');
            if (radar) {
                godChecked = Array.from(radar.querySelectorAll('.target-user:checked')).map(cb => cb.value);
                const allCb = document.getElementById('target-all');
                allChecked = allCb ? allCb.checked : true;
            }
        }

        const btnClass = id => `flex items-center justify-center shrink-0 gap-1.5 sm:gap-2 px-4 py-2 sm:px-5 sm:py-3 rounded-xl sm:rounded-2xl font-extrabold transition-all duration-300 text-xs sm:text-base ${state.tab === id ? 'bg-slate-900 text-white shadow-lg sm:shadow-xl sm:scale-105' : 'bg-white text-slate-500 hover:bg-slate-50 border border-slate-200'}`;
        const content = { catalogo: catalogoView, prestiti: prestitiView, proponi: proponiView, recensioni: recensioniView, admin: adminView, god: godView }[state.tab === "admin" && !state.isAdmin ? "catalogo" : state.tab]();
        
        const animationClass = animate ? 'fade-in' : '';

        appDiv.innerHTML = `
        <nav class="sticky top-0 z-40 glass-panel border-b border-slate-200/60 px-4 sm:px-6 py-3 sm:py-4 shadow-sm">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <span class="text-xl sm:text-2xl font-black text-slate-800 flex items-center gap-2 sm:gap-3"><span class="text-2xl sm:text-3xl drop-shadow-sm hover:rotate-12 transition-transform cursor-pointer">📚</span> <span>2ALD</span></span>
                <div class="flex items-center gap-2 sm:gap-4">
                    ${!state.isAdmin ? `<button onclick="diventaAdmin()" class="text-[10px] sm:text-sm font-extrabold text-amber-600 bg-amber-50 hover:bg-amber-100 px-2.5 py-1.5 sm:px-4 sm:py-2 rounded-lg sm:rounded-xl uppercase sm:capitalize tracking-wide border border-amber-200/50 transition-colors">Admin</button>` : `<button onclick="esciDaAdmin()" class="text-[10px] sm:text-sm font-extrabold ${state.isGod ? 'text-purple-600 bg-purple-50 hover:bg-purple-100 border-purple-200/50' : 'text-rose-600 bg-rose-50 hover:bg-rose-100 border-rose-200/50'} px-2.5 py-1.5 sm:px-4 sm:py-2 rounded-lg sm:rounded-xl uppercase sm:capitalize tracking-wide border shadow-sm transition-colors">${state.isGod ? 'Esci da Dio' : 'Esci da Admin'}</button>`}
                    
                    <button onclick="openModal('profilo')" class="flex items-center gap-2 sm:gap-3 bg-slate-100/80 hover:bg-slate-200/80 px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-xl sm:rounded-full border border-slate-200 transition-colors shadow-sm cursor-pointer group">
                        ${window.getAvatar(state.userData.avatar, "w-6 h-6 sm:w-8 sm:h-8")}
                        <span class="text-xs sm:text-sm font-bold text-slate-700 hidden md:flex items-center group-hover:text-indigo-600 transition-colors">${escapeHTML(state.userData.nome || state.user.displayName)} ${state.userData.badge ? `<span class="ml-1.5 text-[9px] uppercase font-black px-1.5 py-0.5 bg-amber-400 text-amber-900 rounded-md border border-amber-300 shadow-sm">${escapeHTML(state.userData.badge)}</span>` : ''}</span>
                    </button>
                    
                    <button onclick="logout()" class="bg-white border-2 border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-rose-500 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl font-bold text-xs sm:text-base transition-colors shadow-sm">Esci</button>
                </div>
            </div>
        </nav>
        
        <main class="max-w-7xl mx-auto pt-4 sm:pt-8 space-y-6 sm:space-y-10 ${animationClass}">
            <div class="flex flex-nowrap sm:flex-wrap gap-2 sm:gap-3 items-center border-b pb-4 sm:pb-8 px-4 sm:px-6 overflow-x-auto hide-scrollbar snap-x">
                <button onclick="cambiaTab('catalogo')" class="${btnClass('catalogo')} snap-start">📖 Catalogo</button>
                <button onclick="cambiaTab('prestiti')" class="${btnClass('prestiti')} snap-start">🎒 I Miei Libri</button>
                <button onclick="cambiaTab('recensioni')" class="${btnClass('recensioni')} snap-start">⭐ Recensioni & Social</button>
                <button onclick="cambiaTab('proponi')" class="${btnClass('proponi')} snap-start">💡 Proponi</button>
                ${state.isAdmin ? `<button onclick="cambiaTab('admin')" class="${btnClass('admin')} snap-start !bg-amber-400 !text-white !border-amber-400 shadow-amber-400/30">⚙ <span class="hidden sm:inline">Admin</span></button>` : ''}
                ${state.isGod ? `<button onclick="cambiaTab('god')" class="${btnClass('god')} snap-start !bg-purple-600 !text-white !border-purple-600 shadow-purple-600/30">⚡ <span class="hidden sm:inline">L'Olimpo</span></button>` : ''}
                <div class="w-1 shrink-0 sm:hidden"></div>
            </div>
            <div class="pb-10">${content}</div>
        </main>
        ${renderModal()}`;

        if (state.tab === 'god') {
            const radar = document.getElementById('god-radar-list');
            if (radar) {
                godChecked.forEach(val => { const cb = radar.querySelector(`.target-user[value="${val}"]`); if (cb) cb.checked = true; });
                const allCb = document.getElementById('target-all');
                if (allCb) allCb.checked = allChecked;
            }
        }
    }
</script>
</body>
</html>
